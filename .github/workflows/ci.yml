name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node 22 verification
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js 22.13.0
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            functions/scope-api/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix apps/web

      - name: Install function dependencies
        run: npm ci --prefix functions/scope-api

      - name: Verify repository
        run: npm run verify

      - name: Build function deployment artifact
        run: |
          npm run build --prefix functions/scope-api
          test -f functions/scope-api/dist/main.js
